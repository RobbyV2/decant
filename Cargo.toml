# Decant cargo workspace.
#
# IMPORTANT: this is a *mixed-target* workspace. Most crates build for the host
# (native Linux: daemon, cli, core, backend, protocol). A handful build ONLY for
# `x86_64-pc-windows-gnu` (the interposer DLL and the test binaries that run under
# Wine or inside the VM). A bare `cargo build` must NOT try to build the Windows
# crates for Linux, so `default-members` lists host crates only. The Windows crates
# are still members (shared lockfile + target dir) and are built explicitly via
# `cargo build -p <crate> --target x86_64-pc-windows-gnu` (see xtask).
[workspace]
resolver = "2"
members = [
    "xtask",
    "crates/decant-protocol",
    "crates/decant-client",
    "crates/decant-vmi",
    "crates/decant-backend",
    "crates/decant-memflow",
    "crates/decant-analysis",
    "crates/decant-daemon",
    "crates/decant-cli",
    "crates/decant-wine-harness",
    "crates/decant-interpose",
    "crates/decant-inject",
    "testbins/guest-target",
    "testbins/sample-tool",
    "testbins/decant-launcher",
    "testbins/decant-plugin-standard",
    "testbins/decant-external-standard",
    "testbins/dll-smoke",
    "testbins/hello-dll",
    "testbins/guest-inject-fixture",
]
# Host-only crates. `cargo build`/`cargo test` with no `-p`/`--target` touch only these.
#
# `decant-interpose` is a windows-gnu cdylib, but its handle-table + rpc cores are
# platform-agnostic (no Win32), so it is listed here too: that runs the handle-table
# tests under `cargo test` on the host with no Wine (the Win32-binding modules are
# `#[cfg(windows)]` and simply compile out on the host).
default-members = [
    "xtask",
    "crates/decant-protocol",
    "crates/decant-client",
    "crates/decant-vmi",
    "crates/decant-backend",
    "crates/decant-memflow",
    "crates/decant-analysis",
    "crates/decant-daemon",
    "crates/decant-cli",
    "crates/decant-wine-harness",
    "crates/decant-interpose",
    "crates/decant-inject",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RobbyV2/decant"
homepage = "https://github.com/RobbyV2/decant"
readme = "README.md"
keywords = ["memflow", "wine", "windows", "memory", "vm"]
categories = ["development-tools", "command-line-utilities", "os"]

[workspace.dependencies]
decant-analysis = { version = "0.1.0", path = "crates/decant-analysis" }
decant-backend = { version = "0.1.0", path = "crates/decant-backend" }
decant-client = { version = "0.1.0", path = "crates/decant-client" }
decant-daemon = { version = "0.1.0", path = "crates/decant-daemon" }
decant-inject = { version = "0.1.0", path = "crates/decant-inject" }
decant-memflow = { version = "0.1.0", path = "crates/decant-memflow" }
decant-protocol = { version = "0.1.0", path = "crates/decant-protocol" }
decant-vmi = { version = "0.1.0", path = "crates/decant-vmi" }
decant-wine-harness = { version = "0.1.0", path = "crates/decant-wine-harness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
bincode = "1.3"
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
